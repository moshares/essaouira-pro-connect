# Netlify Configuration for SPA
# This ensures proper routing and build settings for React Router SPA

[build]
  # Build command (Vite will output to 'dist' by default)
  command = "npm run build"
  # Publish directory (Vite's default output)
  publish = "dist"

# Redirect rules are handled by public/_redirects file
# The _redirects file will be copied to dist during build
# This ensures all client-side routes resolve correctly

# Headers for security and performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Don't cache HTML files (always get fresh index.html)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Don't cache the redirects file
[[headers]]
  for = "/_redirects"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

